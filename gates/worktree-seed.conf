# worktree-seed.conf — what `agent-worktree.sh` copies into a fresh worktree.
#
# A fresh worktree is missing EVERYTHING gitignored, and each gap surfaces only
# at gate time, after the work is done. Declare every one here; each step is
# verified on disk, and an incomplete worktree exits non-zero.
#
# Step types:
#   install <dir|.> <label> <verify-rel-path>
#   clone   <rel-path> <required|optional> [must-contain]
#   build   <dir|.> <verify-rel-path> <command…>
#
# `clone` uses an APFS clonefile where available, so a 12 GB build directory
# copies in seconds and costs no disk until a file diverges.

# Dependencies. A sub-project that is NOT a workspace member needs its OWN
# install — skip it and its gate fails with a confusing error about a tool
# version, which costs a full push cycle to diagnose.
install . root node_modules/.bin/biome
# install admin admin node_modules/.bin/biome

# Gitignored build inputs a compile step demands. `required` means the worktree
# is NOT ready without it.
# clone apps/api/binaries required
# clone apps/api/assets required

# An artifact that can be cloned if the main checkout has one, and built if not.
# The `clone … optional` line wins when it is there; `build` skips when the
# verify path already exists.
# clone apps/web/dist optional index.html
# build apps/web dist/index.html bun run build

# A WARM build directory — the one that actually decides whether your first push
# passes. A cold one makes the capped lint gate compile the whole graph and get
# killed before it reads a line of your diff. `optional`: a missing warm cache
# costs a cold build, it does not make the worktree unusable.
clone target optional
# clone services/target optional
