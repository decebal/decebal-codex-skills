name: test-skills

on:
  push:
    paths:
      - "skills/**"
      - "tests/**"
      - ".github/workflows/test-skills.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-workspaces: |
            skills/skill-autoresearch/scripts
            skills/app-store-optimization/scripts

      # web-video skill needs ffmpeg/ffprobe.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # uv provisions a Python + Pillow on the fly for the blog-image tests
      # (the test harness uses `uv run --with pillow`).
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Run skill tests
        run: bash tests/run.sh

      - name: Check Rust skill runtimes
        run: |
          cargo fmt --manifest-path skills/skill-autoresearch/scripts/Cargo.toml --all --check
          cargo clippy --locked --manifest-path skills/skill-autoresearch/scripts/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path skills/skill-autoresearch/scripts/Cargo.toml
          cargo fmt --manifest-path skills/app-store-optimization/scripts/Cargo.toml --all --check
          cargo clippy --locked --manifest-path skills/app-store-optimization/scripts/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path skills/app-store-optimization/scripts/Cargo.toml
